  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

  <script type="__bundler/template">"<!DOCTYPE html>\n<html><head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1\">\n<script src=\"0f182c9c-9101-43aa-b2b5-bd283754a851\"><\u002Fscript>\n\n<\u002Fhead>\n<body>\n<x-dc>\n<helmet>\n<style>/* =========================================================\n   LOOPIO DESIGN SYSTEM \u2014 TOKENS\n   2025 Brand Refresh\n   Import this file into every Loopio HTML artifact.\n   @import url('/system/tokens.css');   (adjust path)\n   ========================================================= */\n\n/* ---------- FONTS ----------------------------------------- */\n@font-face {\n  font-family: 'DM Serif Display';\n  src: url(\"ffcf0749-439b-4233-a244-e4240e7d394d\") format('truetype');\n  font-weight: 400;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'DM Serif Display';\n  src: url(\"149e243f-fca7-4513-a35d-eadbe568a929\") format('truetype');\n  font-weight: 400;\n  font-style: italic;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Albert Sans';\n  src: url(\"3228831c-b0b9-41c0-bfbb-79f02d56704a\") format('truetype-variations');\n  font-weight: 100 900;\n  font-style: normal;\n  font-display: swap;\n}\n@font-face {\n  font-family: 'Albert Sans';\n  src: url(\"faf5b25a-664d-477f-86a8-8218e9636298\") format('truetype-variations');\n  font-weight: 100 900;\n  font-style: italic;\n  font-display: swap;\n}\n\n/* ---------- COLOR TOKENS ---------------------------------- */\n/*\n  Every color is named after a mountain.\n  Each has a semantic role + its \"mirror partner\".\n  NEVER use #FFFFFF \u2014 use Snowdon (#F7F6F2) for off-white.\n*/\n:root {\n  /* Neutrals */\n  --snowdon:          #F7F6F2;   /* warm off-white \u2014 primary canvas */\n  --ben-nevis:        #F0DDBF;   /* warm sand \u2014 inviting callouts   */\n  --temple:           #323030;   /* near-black \u2014 body text on light */\n\n  /* Light Accents */\n  --ishpatina-ridge:  #03D4CC;   /* bright teal \u2014 headlines, CTAs   */\n  --nanda-devi:       #CEB9F1;   /* soft lavender \u2014 elevated        */\n  --robson:           #C8D7ED;   /* soft blue \u2014 calm & trustworthy  */\n\n  /* Darks */\n  --kangchenjunga:    #361726;   /* deep plum \u2014 premium             */\n  --grouse:           #1A3234;   /* core brand dark \u2014 energetic     */\n  --logan:            #013C4A;   /* deep teal \u2014 grounded            */\n\n  /* Mirror-pair relationships (see Mirror Principle below)      */\n  /*  Snowdon        \u2194 Ben Nevis     (both neutral / warm)        */\n  /*  Ishpatina      \u2194 Grouse        (teal pair)                  */\n  /*  Nanda Devi     \u2194 Kangchenjunga (plum/lavender pair)         */\n  /*  Robson         \u2194 Logan         (blue pair)                  */\n\n  /* Loop/texture tint \u2014 15% of the counterpart color.\n     These are baked oklch-like mixes; prefer color-mix(...) when\n     you need the exact value, or use the utility class .loop.    */\n  --loop-opacity: 0.08;  /* visual guideline: feels like \"texture, not content\"; keep well below 15% */\n\n  /* ---------- TYPE SCALE ---------------------------------- */\n  --font-serif: 'DM Serif Display', 'Times New Roman', serif;\n  --font-sans:  'Albert Sans', ui-sans-serif, system-ui, sans-serif;\n\n  /* Headlines \u2014 DM Serif Display, regular only */\n  --fs-h1: 64px;   --lh-h1: 1.05;\n  --fs-h2: 48px;   --lh-h2: 1.08;\n  --fs-h3: 36px;   --lh-h3: 1.12;\n  --fs-h4: 28px;   --lh-h4: 1.2;\n\n  /* Sub-heads & buttons \u2014 Albert Sans Bold */\n  --fs-sub-lg: 24px;   --lh-sub-lg: 1.25;\n  --fs-sub:    18px;   --lh-sub:    1.35;\n  --fs-label:  14px;   --lh-label:  1.2;   /* uppercase, tracked   */\n\n  /* Body \u2014 Albert Sans Regular */\n  --fs-body-lg: 18px;  --lh-body-lg: 1.5;\n  --fs-body:    16px;  --lh-body:    1.55;\n  --fs-caption: 14px;  --lh-caption: 1.45;\n\n  /* ---------- SPACING / RADII / MOTION -------------------- */\n  --sp-1: 4px;   --sp-2: 8px;   --sp-3: 12px;  --sp-4: 16px;\n  --sp-5: 24px;  --sp-6: 32px;  --sp-7: 48px;  --sp-8: 64px;\n  --sp-9: 96px;  --sp-10: 128px;\n\n  --radius-sm: 8px;     /* cards, inputs           */\n  --radius-md: 16px;    /* feature cards           */\n  --radius-lg: 24px;    /* hero panels, callouts   */\n  --radius-pill: 999px; /* buttons, tags           */\n\n  --ease-out: cubic-bezier(.2,.7,.2,1);\n  --dur-fast: 140ms;\n  --dur-med:  260ms;\n\n  --shadow-sm: 0 1px 2px rgba(26,50,52,.06), 0 2px 8px rgba(26,50,52,.04);\n  --shadow-md: 0 4px 12px rgba(26,50,52,.08), 0 12px 32px rgba(26,50,52,.06);\n}\n\n/* =========================================================\n   BASE / RESET\n   ========================================================= */\n*, *::before, *::after { box-sizing: border-box; }\nhtml, body { margin: 0; padding: 0; }\n\nbody {\n  font-family: var(--font-sans);\n  font-size: var(--fs-body);\n  line-height: var(--lh-body);\n  color: var(--temple);\n  background: var(--snowdon);\n  -webkit-font-smoothing: antialiased;\n  text-rendering: optimizeLegibility;\n}\n\n/* =========================================================\n   TYPOGRAPHY UTILITIES\n   ========================================================= */\n.h1, .h2, .h3, .h4 {\n  font-family: var(--font-serif);\n  font-weight: 400;\n  margin: 0;\n  letter-spacing: -0.01em;\n  text-wrap: balance;\n}\n.h1 { font-size: var(--fs-h1); line-height: var(--lh-h1); letter-spacing: -0.02em; }\n.h2 { font-size: var(--fs-h2); line-height: var(--lh-h2); letter-spacing: -0.02em; }\n.h3 { font-size: var(--fs-h3); line-height: var(--lh-h3); }\n.h4 { font-size: var(--fs-h4); line-height: var(--lh-h4); }\n\n.sub-lg, .sub, .label {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  margin: 0;\n}\n.sub-lg { font-size: var(--fs-sub-lg); line-height: var(--lh-sub-lg); }\n.sub    { font-size: var(--fs-sub);    line-height: var(--lh-sub);    }\n.label  {\n  font-size: var(--fs-label); line-height: var(--lh-label);\n  text-transform: uppercase; letter-spacing: 0.08em;\n}\n\n.body-lg, .body, .caption {\n  font-family: var(--font-sans);\n  font-weight: 400;\n  margin: 0;\n}\n.body-lg  { font-size: var(--fs-body-lg); line-height: var(--lh-body-lg); }\n.body     { font-size: var(--fs-body);    line-height: var(--lh-body);    }\n.caption  { font-size: var(--fs-caption); line-height: var(--lh-caption); }\n\np { max-width: 62ch; text-wrap: pretty; }\n\n/* =========================================================\n   COLOR PAIRING ZONES\n   Each zone is a background + correct text + loop color.\n   Apply to any container to get a \"valid\" Loopio surface.\n   ========================================================= */\n\n/* Neutrals ------------------------------------------------- */\n.zone-snowdon     { background: var(--snowdon);     color: var(--temple); }\n.zone-snowdon     { --loop-color: var(--ben-nevis); }\n\n.zone-ben-nevis   { background: var(--ben-nevis);   color: var(--temple); }\n.zone-ben-nevis   { --loop-color: var(--temple);   }\n\n/* Light Accents ------------------------------------------- */\n.zone-ishpatina   { background: var(--ishpatina-ridge); color: var(--kangchenjunga); }\n.zone-ishpatina   { --loop-color: var(--kangchenjunga); }\n\n.zone-nanda-devi  { background: var(--nanda-devi);  color: var(--kangchenjunga); }\n.zone-nanda-devi  { --loop-color: var(--kangchenjunga); }\n\n.zone-robson      { background: var(--robson);      color: var(--logan); }\n.zone-robson      { --loop-color: var(--logan); }\n\n/* Darks --------------------------------------------------- */\n.zone-kangchenjunga {\n  background: var(--kangchenjunga);\n  color: var(--snowdon);\n  --headline-color: var(--nanda-devi);\n  --loop-color: var(--nanda-devi);\n}\n.zone-grouse {\n  background: var(--grouse);\n  color: var(--snowdon);\n  --headline-color: var(--ishpatina-ridge);\n  --loop-color: var(--ishpatina-ridge);\n}\n.zone-logan {\n  background: var(--logan);\n  color: var(--snowdon);\n  --headline-color: var(--robson);\n  --loop-color: var(--robson);\n}\n\n/* On dark zones, headlines use the accent color ----------- */\n.zone-kangchenjunga .h1,\n.zone-kangchenjunga .h2,\n.zone-kangchenjunga .h3,\n.zone-kangchenjunga .h4,\n.zone-grouse .h1, .zone-grouse .h2, .zone-grouse .h3, .zone-grouse .h4,\n.zone-logan  .h1, .zone-logan  .h2, .zone-logan  .h3, .zone-logan  .h4 {\n  color: var(--headline-color);\n}\n\n/* =========================================================\n   TEXTURE / LOOP OVERLAY\n   One per layout, 15% opacity, bleeds off the edge,\n   biased to a corner, larger than the container.\n   Usage:\n     <section class=\"zone-grouse has-loop loop--tr\">\n       <img class=\"loop\" src=\"\u2026scribble-hatch.png\" alt=\"\">\n       \u2026content\u2026\n     <\u002Fsection>\n   ========================================================= */\n.has-loop { position: relative; overflow: hidden; isolation: isolate; }\n\n.loop {\n  position: absolute;\n  pointer-events: none;\n  user-select: none;\n  opacity: var(--loop-opacity);\n  /* Recolor the beige/teal source PNGs to the loop-color.\n     We use a CSS mask so any loop asset can become any tint. */\n  -webkit-mask-image: var(--loop-src);\n          mask-image: var(--loop-src);\n  -webkit-mask-repeat: no-repeat;\n          mask-repeat: no-repeat;\n  -webkit-mask-size: contain;\n          mask-size: contain;\n  background: var(--loop-color);\n  width: min(60vw, 780px);\n  aspect-ratio: 1.2 / 1;\n  z-index: 0;\n}\n\n/* Corner biases \u2014 at least two edges bleed off the container. */\n.loop--tr { top: -18%;  right:  -14%; }\n.loop--tl { top: -18%;  left:   -14%; }\n.loop--br { bottom: -22%; right:  -14%; }\n.loop--bl { bottom: -22%; left:   -14%; }\n\n/* Ensure foreground stacks above the loop */\n.has-loop > :not(.loop) { position: relative; z-index: 1; }\n\n/* Preset loop sources (point to the PNG assets) */\n.loop[data-loop=\"swoop\"]   { --loop-src: url('../assets/brand/scribbles/scribble-loop-swoop.png'); }\n.loop[data-loop=\"double\"]  { --loop-src: url('../assets/brand/scribbles/scribble-double-loop.png'); }\n.loop[data-loop=\"wispy\"]   { --loop-src: url('../assets/brand/scribbles/scribble-wispy-loop.png'); }\n.loop[data-loop=\"hatch\"]   { --loop-src: url('../assets/brand/scribbles/scribble-hatch.png'); }\n\n/* =========================================================\n   BUTTONS\n   ========================================================= */\n.btn {\n  display: inline-flex;\n  align-items: center;\n  justify-content: center;\n  gap: var(--sp-2);\n  padding: 14px 28px;\n  min-height: 48px;\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: 16px;\n  line-height: 1;\n  letter-spacing: 0.01em;\n  border-radius: var(--radius-pill);\n  border: 1.5px solid transparent;\n  cursor: pointer;\n  transition: transform var(--dur-fast) var(--ease-out),\n              background var(--dur-fast) var(--ease-out),\n              color var(--dur-fast) var(--ease-out),\n              border-color var(--dur-fast) var(--ease-out);\n  text-decoration: none;\n}\n.btn:active { transform: translateY(1px); }\n\n/* Primary \u2014 Ishpatina Ridge teal, works on ALL backgrounds */\n.btn-primary {\n  background: var(--ishpatina-ridge);\n  color: var(--grouse);\n  border-color: var(--ishpatina-ridge);\n}\n.btn-primary:hover { background: color-mix(in oklab, var(--ishpatina-ridge) 88%, var(--grouse)); }\n\n/* Secondary \u2014 outline in current text color */\n.btn-secondary {\n  background: transparent;\n  color: currentColor;\n  border-color: currentColor;\n}\n.btn-secondary:hover { background: color-mix(in oklab, currentColor 8%, transparent); }\n\n/* Ghost \u2014 text-only with arrow */\n.btn-ghost {\n  background: transparent;\n  color: currentColor;\n  padding: 10px 4px;\n  border-radius: 4px;\n  gap: var(--sp-3);\n}\n.btn-ghost::after {\n  content: \"\u2192\";\n  font-weight: 400;\n  transition: transform var(--dur-fast) var(--ease-out);\n}\n.btn-ghost:hover::after { transform: translateX(3px); }\n\n/* =========================================================\n   CARDS\n   ========================================================= */\n.card {\n  position: relative;\n  border-radius: var(--radius-md);\n  padding: var(--sp-6);\n  display: flex;\n  flex-direction: column;\n  gap: var(--sp-4);\n  overflow: hidden;\n  isolation: isolate;\n}\n.card .eyebrow {\n  font-family: var(--font-sans);\n  font-weight: 700;\n  font-size: 13px;\n  letter-spacing: 0.1em;\n  text-transform: uppercase;\n  opacity: 0.7;\n}\n.card .card-title {\n  font-family: var(--font-serif);\n  font-size: 32px;\n  line-height: 1.1;\n  margin: 0;\n}\n.card .card-body { max-width: 48ch; }\n.card .card-cta  { margin-top: auto; }\n\n/* =========================================================\n   TAG / STAT / EYEBROW\n   ========================================================= */\n.tag {\n  display: inline-flex;\n  align-items: center;\n  gap: var(--sp-2);\n  padding: 6px 14px;\n  border-radius: var(--radius-pill);\n  font-weight: 700;\n  font-size: 13px;\n  background: color-mix(in oklab, currentColor 10%, transparent);\n}\n\n.stat-big {\n  font-family: var(--font-serif);\n  font-size: clamp(72px, 9vw, 144px);\n  line-height: 0.95;\n  letter-spacing: -0.04em;\n}\n\n/* =========================================================\n   LAYOUT HELPERS\n   ========================================================= */\n.wrap {\n  width: 100%;\n  max-width: 1200px;\n  margin-inline: auto;\n  padding-inline: var(--sp-6);\n}\n.stack > * + * { margin-top: var(--sp-4); }\n.row { display: flex; gap: var(--sp-4); flex-wrap: wrap; }\n.grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: var(--sp-6); }\n.grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--sp-6); }\n@media (max-width: 820px) {\n  .grid-2, .grid-3 { grid-template-columns: 1fr; }\n}\n\n/* =========================================================\n   LINKS\n   ========================================================= */\na { color: inherit; text-decoration-thickness: 1.5px; text-underline-offset: 3px; }\na:hover { text-decoration-color: currentColor; }\n<\u002Fstyle>\n<script src=\"efe8c4d4-d173-43d7-955a-76ccb7f7ce15\"><\u002Fscript>\n<style>\n  body{ background:#EFEBE1; }\n  p{ max-width:none; }\n  .lr-scroll::-webkit-scrollbar{ width:10px; height:10px; }\n  .lr-scroll::-webkit-scrollbar-thumb{ background:#D8D2C6; border-radius:8px; }\n  textarea.lr-ta{ font-family:var(--font-sans); font-size:15px; line-height:1.55; color:var(--temple); width:100%; border:1.5px solid #CFC8BA; border-radius:10px; padding:12px 14px; background:var(--snowdon); resize:vertical; outline:none; }\n  textarea.lr-ta:focus{ border-color:var(--logan); }\n  .lr-row:hover{ background:#F4F1E9; }\n  .lr-sumcard{ transition:border-color .14s ease, transform .14s ease; }\n  .lr-sumcard:hover{ transform:translateY(-2px); }\n  .lr-btn{ transition:background .14s ease, border-color .14s ease, transform .14s ease; }\n  .lr-btn:active{ transform:translateY(1px); }\n  .lr-primary:hover{ background:color-mix(in oklab, rgba(56,100,102,1) 88%, black); }\n  .lr-default:hover{ background:rgba(1,60,74,.06); }\n  .lr-danger:hover{ background:rgba(142,59,55,.08); }\n  .lr-link:hover{ color:var(--logan); }\n  .lr-btn2{ display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:var(--font-sans); font-weight:700; font-size:14px; border-radius:999px; padding:11px 20px; cursor:pointer; border:1.5px solid transparent; transition:background .14s ease, border-color .14s ease, transform .12s ease; white-space:nowrap; }\n  .lr-btn2:active{ transform:translateY(1px); }\n  .lr-pri{ background:rgba(56,100,102,1); color:rgba(242,255,255,1); border-color:rgba(56,100,102,1); }\n  .lr-pri:hover{ background:color-mix(in oklab, rgba(56,100,102,1) 88%, black); }\n  .lr-def{ background:var(--snowdon); color:var(--temple); border-color:#D0C9BB; }\n  .lr-def:hover{ background:#F1EDE4; }\n  .lr-dgr{ background:transparent; color:#8E3B37; border-color:#E0C2BE; }\n  .lr-dgr:hover{ background:rgba(142,59,55,.08); }\n  .lr-sm{ padding:8px 15px; font-size:13px; }\n  .lr-xs{ padding:6px 12px; font-size:12.5px; }\n  .lr-menuitem{ display:block; width:100%; text-align:left; background:none; border:none; cursor:pointer; padding:10px 12px; border-radius:8px; font-family:var(--font-sans); font-size:14px; font-weight:600; color:var(--temple); }\n  .lr-menuitem:hover{ background:#F1EDE4; }\n  .lr-menuitem.danger{ color:#8E3B37; }\n  .lr-add{ background:#E6F1EA; color:#2E7D4F; border-radius:4px; padding:0 4px; text-decoration:underline; text-decoration-color:#2E7D4F; text-decoration-thickness:2px; text-underline-offset:4px; }\n  .lr-remove{ background:#F7E6E3; color:#8E3B37; border-radius:4px; padding:0 4px; text-decoration:line-through; }\n  .lr-src{ background:#EFE9F8; color:#6C53A6; border-radius:4px; padding:0 4px; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; display:flex; flex-direction:column; background:#EFEBE1;\">\n\n  <header style=\"position:sticky;top:0;z-index:40;background:var(--grouse);border-bottom:1px solid rgba(247,246,242,.08);display:flex;align-items:center;justify-content:space-between;padding:0 28px;height:60px;\">\n  <div style=\"display:flex;align-items:center;height:100%;gap:24px;\">\n    <img src=\"d929c49b-a740-4b36-a65e-1628caecc490\" alt=\"Loopio\" style=\"height:24px;display:block;\">\n    <span style=\"width:1px;height:22px;background:rgba(247,246,242,.18);\"><\u002Fspan>\n\n    <nav aria-label=\"Primary navigation\" style=\"display:flex;align-items:center;height:100%;gap:26px;\">\n      <button type=\"button\" style=\"height:100%;padding:0;border:0;background:transparent;color:rgba(247,246,242,.68);font-family:var(--font-sans);font-size:14px;font-weight:650;\">Projects<\u002Fbutton>\n      <button type=\"button\" aria-current=\"page\" style=\"position:relative;height:100%;padding:0;border:0;background:transpare inc, excluded:!inc, isMain, notMain:!isMain, btnLabel: inc?'Not a duplicate':'Mark as duplicate', statusFill:fill, statusEmpty:!fill, statusText:text, cardBg: inc?'var(--snowdon)':'#ECE8DF', cardBorder: inc?'#E4DFD4':'#D6CFC0', showMenu:this.state.openMenu==='dupmenu-'+i, menuId:'dupmenu-'+i };\n    });\n    return { title:E[s.main].title, meta:E[s.main].meta, why:E[s.main].why, segs, editing:s.editing, notEditing:!s.editing, draft, showRevert:s.mode!=='original', cards };\n  }\n\n  renderVals() {\n    const s = this.state;\n    const f = s.filter;\n\n    const summaryCards = [\n      { key:'all', label:'All', value:39, icon:'', grid:true, iconBg:'#EDE8DE', iconFg:'#5C564C', active:f==='all' },\n      { key:'project', label:'Project suggestions', value:12, icon:'', clipboard:true, iconBg:this.TONES.project.bg, iconFg:this.TONES.project.fg, active:f==='project' },\n      { key:'scheduled', label:'Scheduled reviews', value:15, icon:'', calendar:true, iconBg:this.TONES.library.bg, iconFg:this.TONES.library.fg, active:f==='scheduled' },\n      { key:'cleanup', label:'Library cleanup', value:12, icon:'', broom:true, iconBg:this.TONES.dup.bg, iconFg:this.TONES.dup.fg, active:f==='cleanup' }\n    ];\n\n    const issues = this.ISSUES.map(it => {\n      const tone = this.TONES[it.tone] || this.TONES.neutral;\n      return { type:it.type, visible: f==='all' || it.category===f, title:it.title, pill:it.pill, pillBg:tone.bg, pillFg:tone.fg,\n        sourceMain:it.sourceMain, sourceSub:it.sourceSub, avatar:it.avatar, assignee:it.assignee, assigneeColor: it.unassigned ? '#8A8377' : 'var(--temple)',\n        hasDue: !!it.due, noDue: !it.due, dueMain: it.due?it.due.main:'', dueSub: it.due?it.due.sub:'' };\n    });\n\n    // reasoning\n    const ro = {};\n    for (const id of this.PANELS){ const open=!!s.reasoning[id]; ro[id]={ open, closed:!open, label: open?'Hide reasoning':'View reasoning' }; }\n\n    // menus\n    const mo = {}; if (s.openMenu) mo[s.openMenu]=true;\n\n    // inline edit scopes\n    const ed = {};\n    for (const sc of Object.keys(this.EDIT_DEFAULTS)){\n      const st = s.edit[sc]||{};\n      ed[sc] = { editing:!!st.editing, notEditing:!st.editing, saved: st.saved!=null, notSaved: st.saved==null, draft: (st.draft!=null?st.draft:this.EDIT_DEFAULTS[sc]), paras: (st.saved!=null?this.splitParas(st.saved):[]) };\n    }\n\n    // citation\n    const cData = s.citation ? this.CITATIONS[s.citation] : null;\n    const citation = cData ? { open:true, title:cData.title, sourceLabel:cData.sourceLabel, items:cData.items } : { open:false, title:'', sourceLabel:'', items:[] };\n\n    const issueLabel = this.issueIndex()>=0 ? ('Issue '+(this.issueIndex()+1)+' of '+this.ORDER.length) : '';\n\n    const is = {}; is[s.screen] = true;\n\n    return {\n      isQueue: s.screen==='queue',\n      isDetail: s.screen!=='queue',\n      screen: s.screen,\n      is,\n      showLoop: this.props.showLoop !== false,\n      confirming: s.confirming,\n      showConfirmC2: s.confirming && s.screen==='conflict',\n      showConfirmC4: s.confirming && s.screen==='conflictFour',\n      showConfirmDup: s.confirming && s.screen==='duplicate',\n      filterChips: ['Type: All','Assignee: Anyone','Due: Any time','Sort: Due soonest'],\n      summaryCards, issues,\n      toast: { open: !!s.toast, title: s.toast?s.toast.title:'', text: s.toast?s.toast.text:'' },\n      citation,\n      ro, mo, ed, issueLabel,\n      onFilter:this.onFilter, onOpenIssue:this.onOpenIssue, back:this.back, next:this.next, prev:this.prev,\n      onResolve:this.onResolve, onReasoning:this.onReasoning, onCitation:this.onCitation, closeCitation:this.closeCitation, stop:this.stop, onMenu:this.onMenu,\n      onEdit:this.onEdit, onCancelEdit:this.onCancelEdit, onSaveEdit:this.onSaveEdit, onDraft:this.onDraft,\n      showConfirm:this.showConfirm, hideConfirm:this.hideConfirm,\n      handoff:s.handoff, draftNote:this.draftNote, handoffChange:this.handoffChange,\n      c2v: this.c2ViewModel(), c4v: thi
